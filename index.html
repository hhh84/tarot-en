<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>塔罗启蒙·在线占卜</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    html.light, html.light body {
      background-color: #ffffff !important;
      color: #000000;
    }
    html.dark, html.dark body {
      background-color: #1a1a1a !important;
      color: #ffffff;
    }
  </style>

  <!-- ===== Adsterra Popunder（官方推荐位置）===== -->
  <script src="https://pl29586904.effectivecpmnetwork.com/89/8c/4f/898c4f18cae7c394971a643ef9e989c8.js"></script>

  <script>
    (function() {
      const isInIframe = window.self !== window.top;
      function applyThemeToDOM(theme) {
        document.documentElement.classList.remove('light','dark');
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
      }
      if (isInIframe) {
        window.addEventListener('message', function(e){
          if(e.data && (e.data.theme==='light'||e.data.theme==='dark')) applyThemeToDOM(e.data.theme);
        });
      } else {
        applyThemeToDOM('light');
      }
    })();
  </script>
</head>
